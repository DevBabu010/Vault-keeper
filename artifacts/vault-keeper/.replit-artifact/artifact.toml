kind = "mobile"
previewPath = "/"
title = "Vault Keeper"
description = "A local-only Android password manager with secure vault locking, encrypted offline storage, password generation, search, auto-lock, and a dark neon glass interface."
version = "1.0.0"
id = "artifacts/vault-keeper"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22059

[services.development]
run = "pnpm --filter @workspace/vault-keeper run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vault-keeper", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/vault-keeper", "run", "serve" ]

[services.env]
PORT = "22059"
BASE_PATH = "/"
